{{ define "main" }}
<article class="single-article">
  <header class="article-header">
    <div class="article-meta" style="margin-bottom: 0.75rem;">
      {{ if .Section }}
        <a href="/{{ .Section }}/" class="collection-badge {{ if eq .Section "tech" }}badge-tech{{ else if eq .Section "dnd" }}badge-dnd{{ end }}">
          &larr; {{ .Section }}
        </a>
      {{ end }}
      <span>{{ .Date.Format "January 02, 2006" }}</span>
      <span>&middot;</span>
      <span>{{ .ReadingTime }} min read</span>
      {{ with .Params.tags }}
        <span>&middot;</span>
        <span style="display: inline-flex; gap: 0.35rem;">
          {{ range . }}
            <span style="color: var(--accent-tag); font-size: 0.8rem;">#{{ . }}</span>
          {{ end }}
        </span>
      {{ end }}
    </div>

    <h1 class="article-title">{{ .Title }}</h1>
    {{ with .Description }}
      <p style="color: var(--text-secondary); font-size: 1.1rem;">{{ . }}</p>
    {{ end }}
  </header>

  <div class="article-content">
    {{ .Content }}
  </div>
</article>
{{ end }}

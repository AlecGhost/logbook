baseURL = "/"
defaultContentLanguage = "en"
title = "AlecGhost's Logbook"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/AlecGhost/spin"
  [[module.imports]]
    path = "github.com/AlecGhost/lighter/hugo"


[languages]
  [languages.en]
    label = "English"
    locale = "en-us"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  collection = "collections"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "catppuccin-mocha"

[params]
  author = "AlecGhost"
  brand = "AlecGhost/Logbook"
  description = "My loogbook. Empty for now..."
  standaloneSection = "notes"
  github = "https://github.com/AlecGhost"
